[tool.ruff]
target-version = "py310"
line-length = 150
exclude = [
    ".git",
    ".github",
    "venv",
    ".venv",
    "dist",
    "build",
    "downloads",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# launcher.py must apply Windows path/symlink patches and sys.path adjustments before importing app
"launcher.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-v"
