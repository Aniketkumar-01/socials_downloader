name: Build & Publish Windows Executable Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build OmniDownloader Windows Installer & Standalone EXE
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller pillow

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress

      - name: Generate Application Icon
        run: |
          python create_icon.py

      - name: Build Standalone Executable
        run: |
          pyinstaller --clean omnidownloader.spec

      - name: Verify Executable Built
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/OmniDownloader.exe")) {
            Write-Error "dist/OmniDownloader.exe was not created!"
            exit 1
          }
          $size = (Get-Item "dist/OmniDownloader.exe").Length / 1MB
          Write-Host "OmniDownloader.exe successfully generated ($([math]::Round($size, 2)) MB)"

      - name: Build Inno Setup Windows Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc.exe).Source
          }
          Write-Host "Using Inno Setup Compiler at: $iscc"
          & $iscc installer.iss
          if (-not (Test-Path "dist/OmniDownloader-Setup.exe")) {
            Write-Error "dist/OmniDownloader-Setup.exe was not created!"
            exit 1
          }
          $setupSize = (Get-Item "dist/OmniDownloader-Setup.exe").Length / 1MB
          Write-Host "OmniDownloader-Setup.exe successfully generated ($([math]::Round($setupSize, 2)) MB)"

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "OmniDownloader Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: |
            dist/OmniDownloader-Setup.exe
            dist/OmniDownloader.exe
          body: |
            ## 🚀 OmniDownloader ${{ github.ref_name }}

            ### 📦 Downloads for Windows:
            - **`OmniDownloader-Setup.exe` (Recommended):** Standard Windows 1-click Installer.
              - Installs cleanly to your user profile (no Administrator/UAC prompt required).
              - Registers in the **Windows Start Menu** and **Windows Search bar** (press `Win` + type `"Omni"`).
              - Creates a desktop shortcut with the official app icon.
              - Fully registered in **Windows Settings > Installed apps** with clean uninstallation.
            - **`OmniDownloader.exe` (Portable):** Standalone single-file executable. Runs directly without installation.

            ### 💡 Note on Windows SmartScreen:
            If Windows displays *"Windows protected your PC"* when opening a newly released app, click **"More info"** and then **"Run anyway"** (standard for newly compiled open-source releases).

            ### ⚠️ Prerequisites for High-Res (1080p/4K) and MP3:
            - High-definition streams require **FFmpeg**.
            - Click the **1-Click Install FFmpeg** button directly inside the app, or run:
              ```powershell
              winget install Gyan.FFmpeg
              ```

            ### 🔍 Diagnostics & Troubleshooting:
            If the application encounters any issue on your system, detailed logs are saved at:
            `%LOCALAPPDATA%\OmniDownloader\launcher.log`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
