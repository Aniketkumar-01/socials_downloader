name: Build & Publish Windows Executable Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    name: Code Quality & Lint Gate (Ruff)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Lint Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint Checks
        run: |
          ruff check .

  test:
    name: Unit & Security Hardening Test Suite (Pytest)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx -r backend/requirements.txt

      - name: Run Pytest Suite
        run: |
          pytest backend/tests/ -v

  build:
    name: Build OmniDownloader Windows Installer & Standalone EXE
    needs: [lint, test]
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Ensure Offline Fonts Bundled
        run: |
          python tools/download_fonts.py

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress

      - name: Build Standalone Executable
        run: |
          pyinstaller --clean omnidownloader.spec

      - name: Verify Executable Built
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/OmniDownloader.exe")) {
            Write-Error "dist/OmniDownloader.exe was not created!"
            exit 1
          }
          $size = (Get-Item "dist/OmniDownloader.exe").Length / 1MB
          Write-Host "OmniDownloader.exe successfully generated ($([math]::Round($size, 2)) MB)"

      - name: Build Inno Setup Windows Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc.exe).Source
          }
          Write-Host "Using Inno Setup Compiler at: $iscc"
          & $iscc installer.iss
          if (-not (Test-Path "dist/OmniDownloader-Setup.exe")) {
            Write-Error "dist/OmniDownloader-Setup.exe was not created!"
            exit 1
          }
          $setupSize = (Get-Item "dist/OmniDownloader-Setup.exe").Length / 1MB
          Write-Host "OmniDownloader-Setup.exe successfully generated ($([math]::Round($setupSize, 2)) MB)"

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "OmniDownloader Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: |
            dist/OmniDownloader-Setup.exe
            dist/OmniDownloader.exe
          body: |
            # ⚡ OmniDownloader ${{ github.ref_name }}

            A fast, local-first universal media and playlist downloader for Windows (YouTube, Instagram, TikTok, X/Twitter, Bilibili, and 1,000+ sites) with real-time SSE progress.

            ---

            ### 📦 Windows Downloads
            | File | Type | Description |
            | :--- | :--- | :--- |
            | **`OmniDownloader-Setup.exe`** | **Installer (Recommended)** | 1-Click setup wizard. Adds Start Menu & Windows Search integration (`Win` + `"Omni"`), desktop shortcut, and clean uninstall via Windows Settings. |
            | **`OmniDownloader.exe`** | **Portable Standalone** | Single binary executable. No installation required; run directly from any folder or USB. |

            ---

            ### ✨ Key Highlights:
            - 🛡️ **Production Security Hardened**: Session auth token enforcement (`X-Omni-Token`), DNS rebinding mitigation (Host header restriction), and path traversal defense.
            - 📑 **Smart Playlist & Batch Engine**: Detects and extracts playlists with item selection checkboxes and safe ceiling caps.
            - 🍪 **Resilient Extraction**: Integrated cookie jar support with privacy-preserving opt-in browser probing.
            - ⚡ **Live Real-Time SSE Stream**: Millisecond-accurate download speed, downloaded size, and dynamic ETA tracking.
            - 🎬 **Bundled FFmpeg Engine**: High-resolution video stream merging (1080p, 4K) and MP3 conversion work out-of-the-box without manual dependencies.
            - 🚀 **Zero-Config Installer**: Installs cleanly to user profile without Administrator/UAC prompts.

            ---

            ### 💡 Note on Windows SmartScreen:
            If Windows displays *"Windows protected your PC"* when opening a newly released app:
            1. Click **"More info"**.
            2. Click **"Run anyway"**.
            *(Standard for newly compiled open-source releases without expensive commercial code-signing certificates).*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
