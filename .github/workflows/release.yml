name: Build & Publish Release (Windows & Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer & Standalone EXE
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller pillow

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress

      - name: Generate Application Icon
        run: |
          python create_icon.py

      - name: Build Standalone Executable
        run: |
          pyinstaller --clean omnidownloader.spec

      - name: Verify Executable Built
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/OmniDownloader.exe")) {
            Write-Error "dist/OmniDownloader.exe was not created!"
            exit 1
          }
          $size = (Get-Item "dist/OmniDownloader.exe").Length / 1MB
          Write-Host "OmniDownloader.exe successfully generated ($([math]::Round($size, 2)) MB)"

      - name: Build Inno Setup Windows Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc.exe).Source
          }
          Write-Host "Using Inno Setup Compiler at: $iscc"
          & $iscc installer.iss
          if (-not (Test-Path "dist/OmniDownloader-Setup.exe")) {
            Write-Error "dist/OmniDownloader-Setup.exe was not created!"
            exit 1
          }
          $setupSize = (Get-Item "dist/OmniDownloader-Setup.exe").Length / 1MB
          Write-Host "OmniDownloader-Setup.exe successfully generated ($([math]::Round($setupSize, 2)) MB)"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/OmniDownloader-Setup.exe
            dist/OmniDownloader.exe

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace || gradle assembleDebug --no-daemon --stacktrace
          mkdir -p ../dist-android
          cp app/build/outputs/apk/debug/app-debug.apk ../dist-android/OmniDownloader.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist-android/OmniDownloader.apk

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist-release

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist-release

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "OmniDownloader Release ${{ github.ref_name || 'Latest' }}"
          tag_name: ${{ github.ref_name || 'latest' }}
          files: |
            dist-release/OmniDownloader-Setup.exe
            dist-release/OmniDownloader.exe
            dist-release/OmniDownloader.apk
          body: |
            # ⚡ OmniDownloader ${{ github.ref_name || 'Release' }}

            Universal high-performance media and playlist downloader for **Windows** & **Android** (YouTube, Instagram, TikTok, X/Twitter, Bilibili, and 1,000+ sites) at full quality with real-time SSE progress.

            ---

            ### 📱 Android Mobile Download
            | File | Type | Description |
            | :--- | :--- | :--- |
            | **`OmniDownloader.apk`** | **Android App (Universal)** | Standalone native Android application. Download media directly to your phone's Gallery, VLC, and Music library with system Share Sheet integration. |

            ---

            ### 🪟 Windows Desktop Downloads
            | File | Type | Description |
            | :--- | :--- | :--- |
            | **`OmniDownloader-Setup.exe`** | **Installer (Recommended)** | 1-Click setup wizard. Adds Start Menu & Windows Search integration (`Win` + `"Omni"`), desktop shortcut, and clean uninstall. |
            | **`OmniDownloader.exe`** | **Portable Standalone** | Single binary executable. No installation required; run directly from any folder or USB. |

            ---

            ### ✨ Key Features:
            - 📱 **Native Android Mobile App**: 100% on-device embedded CPython + `yt-dlp` + FFmpeg.
            - 🔗 **Android Share Sheet Receiver**: Tap "Share" in YouTube, Instagram, or TikTok and pick OmniDownloader.
            - 🛡️ **Production Security Hardened**: Hardened against command injection, token exfiltration, and path traversal.
            - 📑 **Smart Playlist & Batch Engine**: Detects and extracts playlists with granular item selection checkboxes.
            - 🍪 **Bot Challenge Bypass**: Integrated cookie manager and in-app sign-in WebView.
            - ⚡ **Live Real-Time SSE Stream**: Millisecond-accurate download speed, downloaded size, and dynamic ETA tracking.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
