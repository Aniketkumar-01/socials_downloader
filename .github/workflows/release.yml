name: Build & Publish Windows Executable Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build OmniDownloader Windows Installer & Standalone EXE
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller pillow

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress

      - name: Generate Application Icon
        run: |
          python create_icon.py

      - name: Build Standalone Executable
        run: |
          pyinstaller --clean omnidownloader.spec

      - name: Verify Executable Built
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/OmniDownloader.exe")) {
            Write-Error "dist/OmniDownloader.exe was not created!"
            exit 1
          }
          $size = (Get-Item "dist/OmniDownloader.exe").Length / 1MB
          Write-Host "OmniDownloader.exe successfully generated ($([math]::Round($size, 2)) MB)"

      - name: Build Inno Setup Windows Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc.exe).Source
          }
          Write-Host "Using Inno Setup Compiler at: $iscc"
          & $iscc installer.iss
          if (-not (Test-Path "dist/OmniDownloader-Setup.exe")) {
            Write-Error "dist/OmniDownloader-Setup.exe was not created!"
            exit 1
          }
          $setupSize = (Get-Item "dist/OmniDownloader-Setup.exe").Length / 1MB
          Write-Host "OmniDownloader-Setup.exe successfully generated ($([math]::Round($setupSize, 2)) MB)"

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "OmniDownloader Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: |
            dist/OmniDownloader-Setup.exe
            dist/OmniDownloader.exe
          body: |
            # ⚡ OmniDownloader ${{ github.ref_name }}

            A fast, local-first universal media and playlist downloader for Windows (YouTube, Instagram, TikTok, X/Twitter, Bilibili, and 1,000+ sites) at full quality with real-time SSE progress.

            ---

            ### 📦 Windows Downloads
            | File | Type | Description |
            | :--- | :--- | :--- |
            | **`OmniDownloader-Setup.exe`** | **Installer (Recommended)** | 1-Click setup wizard. Adds Start Menu & Windows Search integration (`Win` + `"Omni"`), desktop shortcut, and clean uninstall via Windows Settings. |
            | **`OmniDownloader.exe`** | **Portable Standalone** | Single binary executable. No installation required; run directly from any folder or USB. |

            ---

            ### ✨ Key Highlights:
            - 🛡️ **Production Security Hardened**: Hardened against command injection, token exfiltration, and path traversal with strict validation.
            - 📑 **Smart Playlist & Batch Engine**: Detects and extracts playlists with item selection checkboxes and safe ceiling caps.
            - 🍪 **Bot Challenge Bypass**: Integrated cookie manager and browser session probing to bypass YouTube bot checks.
            - ⚡ **Live Real-Time SSE Stream**: Millisecond-accurate download speed, downloaded size, and dynamic ETA tracking.
            - 🚀 **Zero-Config Installer**: Installs cleanly to user profile without Administrator/UAC prompts.

            ---

            ### 💡 Note on Windows SmartScreen:
            If Windows displays *"Windows protected your PC"* when opening a newly released app:
            1. Click **"More info"**.
            2. Click **"Run anyway"**.
            *(Standard for newly compiled open-source releases without expensive enterprise certificates).*

            ### 🛠️ Prerequisites for 1080p, 4K & MP3:
            Merging high-resolution streams requires **FFmpeg**. Use the 1-click installer inside app settings, or run:
            ```powershell
            winget install Gyan.FFmpeg
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
